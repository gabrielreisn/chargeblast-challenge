# Git hooks, installed by `pnpm install` (the `prepare` script runs `lefthook install`).
# Docs: https://lefthook.dev
pre-commit:
  # Run jobs in order and stop at the first failure: secret scan, lint fixes, then format.
  piped: true
  jobs:
    # First, so a secret never reaches a commit (CI scans again with gitleaks).
    - name: secrets
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "gitleaks is required for the pre-commit secret scan. Install it: brew install gitleaks"
          exit 1
        fi
        gitleaks git --pre-commit --staged --redact --no-banner --verbose
    - name: lint
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"
      run: pnpm exec oxlint --fix --deny-warnings {staged_files}
      stage_fixed: true
    - name: format
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,md,css,yml,yaml}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
